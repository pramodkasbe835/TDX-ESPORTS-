name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q tdx-esports.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find Node project
        run: |
          PACKAGE=$(find project -type f -name package.json -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "Found package.json: $PACKAGE"
          NODE_DIR=$(dirname "$PACKAGE")
          echo "NODE_DIR=$NODE_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$NODE_DIR"
          npm install

      - name: Sync Capacitor Android
        run: |
          cd "$NODE_DIR"
          npx cap sync android

      - name: Update compileSdk
        run: |
          find "$NODE_DIR/android" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 |
          xargs -0 sed -i -E 's/compileSdk(Version)?[[:space:]]*[=:]?[[:space:]]*35/compileSdk\1 36/g'

      - name: Find Gradle project
        run: |
          find project -name local.properties -delete

          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "Found Gradle: $GRADLEW"
          chmod +x "$GRADLEW"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/$GRADLEW" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: project/**/build/outputs/apk/**/*.apk
