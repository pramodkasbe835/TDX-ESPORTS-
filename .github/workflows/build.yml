name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q tdx-esports.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find Node project
        run: |
          PACKAGE=$(find project -type f -name package.json -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi

          NODE_DIR=$(dirname "$PACKAGE")

          echo "NODE_DIR=$NODE_DIR" >> "$GITHUB_ENV"

          echo "Found Node project:"
          echo "$NODE_DIR"

      - name: Install dependencies
        run: |
          cd "$NODE_DIR"
          npm install

      - name: Sync Capacitor Android
        run: |
          cd "$NODE_DIR"
          npx cap sync android

      - name: Force compileSdk 36
        run: |
          cat > "$GITHUB_WORKSPACE/force-sdk.gradle" <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      try {
                          androidExtension.compileSdkVersion(36)
                          println("FORCED compileSdk = 36 for " + project.path)
                      } catch (Exception e) {
                          println("Could not set compileSdk for " + project.path)
                      }
                  }
              }
          }
          EOF

      - name: Remove local SDK settings
        run: |
          find "$NODE_DIR/android" -name local.properties -delete || true

      - name: Find Gradle project
        run: |
          GRADLEW=$(find "$NODE_DIR/android" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"

          ./gradlew \
            --init-script "$GITHUB_WORKSPACE/force-sdk.gradle" \
            assembleDebug \
            --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$NODE_DIR/android" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
