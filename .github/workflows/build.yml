name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip tdx-esports-google-login.zip -d project

      - name: Prepare web files
        run: |
          cd project

          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -type f -name "*.html" -exec cp {} www/ \;

          if [ -d static ]; then
            cp -R static www/
          fi

          echo "Web files:"
          ls -la www

      - name: Install dependencies and sync Capacitor
        run: |
          cd project
          npm install
          npx cap sync android

      - name: Force compileSdk 36
        run: |
          cat > "$GITHUB_WORKSPACE/force-compile-sdk.gradle" <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                          println("FORCED compileSdk = 36 for ${project.name}")
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd project/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --init-script "$GITHUB_WORKSPACE/force-compile-sdk.gradle" \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
